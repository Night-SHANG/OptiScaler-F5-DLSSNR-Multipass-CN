name: Correct fixed release metadata once
"on":
  push:
    branches: ["release-metadata/20261101-8a18828f"]
    paths: [".github/workflows/correct-release-metadata-20261101.yml"]
permissions:
  contents: read
concurrency:
  group: correct-release-20261101-430077502
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fixed release verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          """One-shot candidate retention. Stdlib only; no artifact code execution.
          CI entry is generated inline with an immutable per-repository manifest.
          """
          import hashlib,io,json,os,posixpath,re,stat,sys,urllib.request,urllib.error,urllib.parse,zipfile
          class Stop(RuntimeError):pass
          def require(ok,message):
           if not ok:raise Stop(message)
          def sha(data):return hashlib.sha256(data).hexdigest()
          def extract_assets(blob,m):
           require(len(blob)==m['artifact']['size_in_bytes'],'archive size mismatch')
           require('sha256:'+sha(blob)==m['artifact']['digest'],'archive hash mismatch')
           with zipfile.ZipFile(io.BytesIO(blob)) as z:
            infos=z.infolist();require(len(infos)<=4096,'too many members');seen=set();total=0
            for i in infos:
             n=i.filename
             require(n and not n.startswith('/') and '\\' not in n and ':' not in n and not any(p in ('..','.','') for p in n.rstrip('/').split('/')),'unsafe zip path')
             require(n not in seen,'duplicate member');seen.add(n)
             mode=i.external_attr>>16
             require(stat.S_IFMT(mode) in (0,stat.S_IFREG,stat.S_IFDIR),'nonregular zip entry')
             require(not i.flag_bits&1,'encrypted entry')
             total+=i.file_size
             require(total<=1024*1024*1024 and i.file_size<=512*1024*1024,'archive expansion limit')
             require(i.file_size<=max(1,i.compress_size)*1000,'compression ratio limit')
            result={}
            for a in m['assets']:
             require(re.fullmatch(r'[A-Za-z0-9_.-]+',a['name']) and a['name'] not in result,'unsafe asset name')
             require(a['member'] in seen,'missing asset')
             data=z.read(a['member']);require(len(data)==a['size'] and sha(data)==a['sha256'],'asset mismatch')
             result[a['name']]=data
            return result
          
          def guard(m,e,event):
           expected={'GITHUB_ACTIONS':'true','GITHUB_EVENT_NAME':'push','GITHUB_REPOSITORY':m['repository'],'GITHUB_REF':'refs/heads/'+m['publish_branch'],'GITHUB_RUN_ATTEMPT':'1','GITHUB_WORKFLOW_REF':m['repository']+'/'+m['workflow_path']+'@refs/heads/'+m['publish_branch']}
           for k,v in expected.items():require(e.get(k)==v,'context mismatch: '+k)
           require(re.fullmatch('[0-9a-f]{40}',e.get('GITHUB_SHA','')),'invalid publisher sha')
           require(event.get('after')==e['GITHUB_SHA'] and event.get('before')==m['head'],'publisher must be single push after reviewed source')
           require(event.get('forced') is False and event.get('deleted') is False,'forced/deleted event')
           require(event.get('repository',{}).get('full_name')==m['repository'],'event repository mismatch')
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):return None
          class API:
           def __init__(self,token,write=False):self.token=token;self.write=write;self.opener=urllib.request.build_opener(NoRedirect)
           def request(self,method,path,body=None,binary=False):
            require(method=='GET' or self.write,'read-only API')
            url=path if path.startswith('https://') else 'https://api.github.com'+path
            u=urllib.parse.urlsplit(url);require(u.scheme=='https' and u.hostname in ('api.github.com','uploads.github.com') and not u.username,'untrusted API endpoint')
            data=body if isinstance(body,bytes) else json.dumps(body).encode() if body is not None else None
            # Actions artifact archives negotiate a JSON API redirect; release assets use octet-stream.
            accept='application/octet-stream' if binary and re.fullmatch(r'/repos/[^/]+/[^/]+/releases/assets/[0-9]+',u.path) else 'application/vnd.github+json'
            endpoint=method+' '+u.path
            print('GitHub request:',endpoint,flush=True)
            headers={'Authorization':'Bearer '+self.token,'Accept':accept,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/octet-stream' if isinstance(body,bytes) else 'application/json'}
            try:
             response=self.opener.open(urllib.request.Request(url,data=data,method=method,headers=headers),timeout=180)
            except urllib.error.HTTPError as ex:
             if ex.code==404 and method=='GET' and not binary:return None
             if ex.code in (301,302,303,307,308) and method=='GET' and binary:
              target=ex.headers.get('Location','');host=urllib.parse.urlsplit(target)
              require(host.scheme=='https' and not host.username and host.hostname and (host.hostname.endswith('.blob.core.windows.net') or host.hostname=='release-assets.githubusercontent.com' or host.hostname.endswith('.githubusercontent.com')),'untrusted download redirect')
              # Fresh request without Authorization; no automatic chained redirects.
              try:response=self.opener.open(urllib.request.Request(target,headers={'Accept':'application/octet-stream'}),timeout=180)
              except Exception:raise Stop('redirected download failed (URL redacted)') from None
             else:raise Stop('GitHub HTTP '+str(ex.code)+' at '+endpoint+' (body/query redacted)') from None
            except Exception:raise Stop('GitHub request failed at '+endpoint+' (details redacted)') from None
            with response:
             data=response.read(512*1024*1024+1);require(len(data)<=512*1024*1024,'response exceeds limit')
            return data if binary else json.loads(data)
          
          def verify_publisher(api,m,publisher):
           root='/repos/'+m['repository']
           ref=api.request('GET',root+'/git/ref/heads/'+m['publish_branch'])
           require(ref and ref['object']['sha']==publisher,'publisher branch changed')
           commit=api.request('GET',root+'/commits/'+publisher)
           require(commit and [p['sha'] for p in commit['parents']]==[m['head']],'publisher parent mismatch')
           require(len(commit['files'])==1 and commit['files'][0]['filename']==m['workflow_path'] and commit['files'][0]['status']=='added','publisher must only add fixed workflow')
          
          # Only the fixed metadata correction writes below are permitted.
          RELEASE_KEYS=('id','tag_name','target_commitish','name','body','draft','prerelease')
          ASSET_KEYS=('id','name','label','size','digest','state')
          def asset_snapshot(a):
           out={k:a.get(k) for k in ASSET_KEYS}
           # GitHub uses either null or empty string for an asset without a display label.
           if out['label'] is None:out['label']=''
           return out
          def release_snapshot(r):
           return {**{k:r.get(k) for k in RELEASE_KEYS},'assets':sorted((asset_snapshot(a) for a in r['assets']),key=lambda a:a['id'])}
          def validate_manifest(m):
           a={a['id']:a for a in m['release']['assets']};require(len(a)==len(m['release']['assets']),'duplicate original assets')
           require(len({c['id'] for c in m['changes']})==len(m['changes']),'duplicate change id')
           changed={}
           for c in m['changes']:
            require(c['id'] in a,'unknown asset id');require(set(c)=={'id','name','label'},'unexpected asset changes')
            require(re.fullmatch(r'[A-Za-z0-9_.-]+',c['name']) and c['name'] not in ('.','..'),'unsafe name');changed[c['id']]=c
           names=[changed.get(i,x)['name'] for i,x in a.items()]
           require(len(set(names))==len(names),'asset name collision')
           require(m['checksum']['name']=='CURRENT-DOWNLOAD-SHA256SUMS.txt' and m['checksum']['name'] not in names,'checksum collision')
           packages=[(changed.get(i,x)['name'],x['digest']) for i,x in a.items() if x['name'].endswith(('.zip','.exe'))]
           require(packages and all(re.fullmatch('sha256:[0-9a-f]{64}',d) for n,d in packages),'missing package digest')
           require(m['checksum']['text']==''.join(d[7:]+'  '+n+'\n' for n,d in sorted(packages)),'checksum content mismatch')
           require(set(m['patch'])=={'name','body','prerelease','draft','make_latest'} and m['patch']['draft'] is False,'invalid release patch')
           require((m['patch']['prerelease'],m['patch']['make_latest']) in ((True,'false'),(False,'true')),'latest/prerelease mismatch')
          
          def authorize_write(m,method,path,body):
           root='/repos/'+m['repository'];rid=str(m['release']['id'])
           if method=='PATCH' and path==root+'/releases/'+rid:
            require(body==m['patch'],'release patch mismatch');return
           for c in m['changes']:
            if method=='PATCH' and path==root+'/releases/assets/'+str(c['id']):
             require(body=={'name':c['name'],'label':c['label']},'asset patch mismatch');return
           url='https://uploads.github.com'+root+'/releases/'+rid+'/assets?name='+m['checksum']['name']
           if method=='POST' and path==url:
            require(body==m['checksum']['text'].encode(),'checksum bytes mismatch');return
           raise Stop('write outside exact correction scope')
          
          class CorrectionAPI(API):
           def __init__(self,token,m,write=False):super().__init__(token,write);self.m=m
           def request(self,method,path,body=None,binary=False):
            if method!='GET':authorize_write(self.m,method,path,body)
            return super().request(method,path,body,binary)
          
          def verify_identity(api,m):
           root='/repos/'+m['repository']
           tag=api.request('GET',root+'/git/ref/tags/'+urllib.parse.quote(m['release']['tag_name'],safe=''))
           require(tag and tag['object']['type']=='commit' and tag['object']['sha']==m['head'],'tag target changed')
           main=api.request('GET',root+'/git/ref/heads/main');require(main and main['object']['sha']==m['main'],'main changed')
           for run in m['runs']:
            got=api.request('GET',root+'/actions/runs/'+str(run['id']))
            require(got and all(got.get(k)==run[k] for k in ('id','head_sha','run_attempt')) and got['repository']['full_name']==m['repository'] and got['status']=='completed' and got['conclusion']=='success','original CI binding changed')
          
          def verify_history(api,m):
           root='/repos/'+m['repository']
           for expected in m['old_releases']:
            actual=api.request('GET',root+'/releases/'+str(expected['id']))
            require(actual and release_snapshot(actual)==expected,'historical release changed')
          
          def latest_id(api,m):
           got=api.request('GET','/repos/'+m['repository']+'/releases/latest');return got['id'] if got else None
          
          def verify(api,m):
           validate_manifest(m);verify_identity(api,m);verify_history(api,m)
           require(latest_id(api,m)==m['latest_before'],'latest changed')
           got=api.request('GET','/repos/'+m['repository']+'/releases/'+str(m['release']['id']))
           require(got and release_snapshot(got)==release_snapshot(m['release']),'release snapshot changed')
           require(not got.get('immutable',False),'release is immutable')
           return got
          
          def expected_assets(m,checksum_id=None):
           out={a['id']:asset_snapshot(a) for a in m['release']['assets']}
           for c in m['changes']:out[c['id']].update(c)
           if checksum_id is not None:
            data=m['checksum']['text'].encode();out[checksum_id]={'id':checksum_id,'name':m['checksum']['name'],'label':'','size':len(data),'digest':'sha256:'+sha(data),'state':'uploaded'}
           return sorted(out.values(),key=lambda a:a['id'])
          
          def verify_assets(api,m,checksum_id=None):
           got=api.request('GET','/repos/'+m['repository']+'/releases/'+str(m['release']['id'])+'/assets?per_page=100')
           require(isinstance(got,list) and sorted((asset_snapshot(a) for a in got),key=lambda a:a['id'])==expected_assets(m,checksum_id),'corrected assets mismatch')
          
          def correct(api,m):
           verify(api,m);root='/repos/'+m['repository'];rid=str(m['release']['id']);last='none'
           try:
            for c in m['changes']:
             path=root+'/releases/assets/'+str(c['id']);body={'name':c['name'],'label':c['label']}
             authorize_write(m,'PATCH',path,body);last='asset PATCH '+str(c['id'])
             result=api.request('PATCH',path,body)
             expected=next(a for a in expected_assets(m) if a['id']==c['id'])
             require(asset_snapshot(result)==expected,'asset PATCH response mismatch')
            verify_assets(api,m)
            data=m['checksum']['text'].encode();url='https://uploads.github.com'+root+'/releases/'+rid+'/assets?name='+m['checksum']['name']
            authorize_write(m,'POST',url,data);last='checksum upload'
            added=api.request('POST',url,data);newid=added['id']
            require(newid not in {a['id'] for a in m['release']['assets']},'checksum id collision')
            verify_assets(api,m,newid)
            verify_identity(api,m);verify_history(api,m)
            require(latest_id(api,m)==m['latest_before'],'latest changed before final PATCH')
            current=api.request('GET',root+'/releases/'+rid)
            require(all(current.get(k)==m['release'].get(k) for k in RELEASE_KEYS),'release metadata changed before final PATCH')
            path=root+'/releases/'+rid;authorize_write(m,'PATCH',path,m['patch']);last='final release PATCH'
            api.request('PATCH',path,m['patch'])
            final=api.request('GET',path)
            require(all(final.get(k)==m['release'].get(k) for k in ('id','tag_name','target_commitish')),'release identity changed')
            require(all(final.get(k)==m['patch'][k] for k in ('name','body','draft','prerelease')),'final release metadata mismatch')
            verify_assets(api,m,newid);verify_identity(api,m);verify_history(api,m)
            require(latest_id(api,m)==(m['release']['id'] if m['patch']['make_latest']=='true' else m['latest_before']),'final latest mismatch')
            print('CORRECTION_VERIFIED',json.dumps({'repository':m['repository'],'release_id':m['release']['id'],'title':m['patch']['name'],'prerelease':m['patch']['prerelease'],'checksum_asset_id':newid}))
            return final
           except Exception as ex:
            raise Stop('correction outcome may be partial or uncertain after '+last+'; do not retry automatically; reconcile fixed release/asset IDs first'+('; '+str(ex) if isinstance(ex,Stop) else '')) from None
          
          def correction_main(m,mode):
           guard(m,os.environ,json.load(open(os.environ['GITHUB_EVENT_PATH'])))
           require(mode in ('verify','correct'),'invalid mode')
           api=CorrectionAPI(os.environ['GITHUB_TOKEN'],m,write=mode=='correct')
           verify_publisher(api,m,os.environ['GITHUB_SHA'])
           if mode=='verify':verify(api,m);print('READ_ONLY_CORRECTION_CHECK_PASSED',m['repository'])
           else:correct(api,m)
          
