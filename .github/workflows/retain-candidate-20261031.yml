             data=response.read(512*1024*1024+1);require(len(data)<=512*1024*1024,'response exceeds limit')
            return data if binary else json.loads(data)
          
          def verify_publisher(api,m,publisher):
           root='/repos/'+m['repository']
           ref=api.request('GET',root+'/git/ref/heads/'+m['publish_branch'])
           require(ref and ref['object']['sha']==publisher,'publisher branch changed')
           commit=api.request('GET',root+'/commits/'+publisher)
           require(commit and [p['sha'] for p in commit['parents']]==[m['head']],'publisher parent mismatch')
           require(len(commit['files'])==1 and commit['files'][0]['filename']==m['workflow_path'] and commit['files'][0]['status']=='added','publisher must only add fixed workflow')
          
          def verify_remote(api,m):
           root='/repos/'+m['repository']
           ref=api.request('GET',root+'/git/ref/heads/'+m['branch']);require(ref and ref['object']['sha']==m['head'],'source branch changed')
           for commit in (m['head'],m['checkout']):
            c=api.request('GET',root+'/git/commits/'+commit);require(c and c['tree']['sha']==m['tree'],'source/checkout tree mismatch')
           pr=api.request('GET',root+'/pulls/'+str(m['pr']))
           require(pr and pr['state']=='open' and pr['head']['sha']==m['head'] and pr['base']['sha']==m['base'] and pr['head']['repo']['full_name']==m['repository'],'PR binding changed')
           for expected in m['runs']:
            path=root+'/actions/runs/'+str(expected['id'])
            run=api.request('GET',path)
            for key in ('id','head_sha','head_branch','workflow_id','path','run_attempt','event'):
             require(run and run.get(key)==expected[key],'run mismatch: '+key)
            require(run['repository']['full_name']==m['repository'] and run['status']=='completed' and run['conclusion']=='success','run not green')
            attempt=api.request('GET',path+'/attempts/'+str(expected['run_attempt']))
            require(attempt and attempt['conclusion']=='success' and attempt['head_sha']==m['head'] and attempt['run_attempt']==expected['run_attempt'],'attempt mismatch')
            jobs=api.request('GET',path+'/attempts/'+str(expected['run_attempt'])+'/jobs?per_page=100')
            require(jobs and jobs['total_count']==len(expected['jobs']),'job count mismatch')
            actual={j['id']:j for j in jobs['jobs']}
            for j in expected['jobs']:
             got=actual.get(j['id']);require(got and got['name']==j['name'] and got['status']=='completed' and got['conclusion']==j['conclusion'] and got['conclusion'] in ('success','skipped'),'job mismatch')
           a=api.request('GET',root+'/actions/artifacts/'+str(m['artifact']['id']))
           for k in ('id','name','size_in_bytes','digest'):require(a and a.get(k)==m['artifact'][k],'artifact mismatch: '+k)
           require(not a['expired'] and a['workflow_run']['id']==m['runs'][0]['id'] and a['workflow_run']['head_sha']==m['head'],'artifact run mismatch')
