          class Stop(RuntimeError):
              pass


          def require(ok, message):
              if not ok:
                  raise Stop(message)


          def sha(data):
              return hashlib.sha256(data).hexdigest()


          def object_json(data, label):
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      require(key not in result, 'duplicate JSON key: ' + label)
                      result[key] = value
                  return result
              try:
                  value = json.loads(data.decode('utf-8-sig') if isinstance(data, bytes) else data,
                                     object_pairs_hook=unique,
                                     parse_constant=lambda _: (_ for _ in ()).throw(ValueError('nonfinite')))
              except (ValueError, UnicodeError) as ex:
                  raise Stop('invalid JSON: ' + label) from ex
              require(isinstance(value, dict), 'JSON object required: ' + label)
              return value


          def expected_kit():
              return {'version': '1.1.0.140', 'archive_url': KIT_URL, 'archive_sha256': KIT_SHA256,
                      'source_repository': 'https://github.com/janblade/f5low-fg', 'source_commit': KIT_SOURCE,
                      'intel_version': '1.3.4.95',
                      'files': [{'path': n, 'sha256': FILE_SHA256[n], 'size': FILE_SIZES[n]} for n in sorted(FILE_SHA256)]}


          def package_name(m):
              return ('OptiScaler-F5-DLSSNR-Multipass-CN-' + m['upstream_version'] + '-cn-'
                      + m['checkout'][:12] + '-' + m['upstream'][:12] + '.zip')


          def positive(value):
              return type(value) is int and value > 0


          def validate_manifest(m):
              keys = {'repository', 'head', 'checkout', 'tree', 'base', 'upstream', 'upstream_version',
                      'branch', 'publish_branch', 'workflow_path', 'pr', 'tag', 'title', 'notes',
                      'runs', 'artifact', 'assets', 'make_latest'}
              require(isinstance(m, dict) and set(m) == keys, 'manifest keys must match the reviewed schema')
              require(m['repository'] == REPOSITORY and m['tag'] == TAG and m['title'] == TITLE,
                      'fixed repository/tag/title mismatch')
              for key in ('head', 'checkout', 'tree', 'base', 'upstream'):
                  require(isinstance(m[key], str) and re.fullmatch('[0-9a-f]{40}', m[key]), 'invalid full SHA: ' + key)
              require(isinstance(m['upstream_version'], str) and
                      (m['upstream_version'] == 'main-' + m['upstream'][:12]
                       or re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?', m['upstream_version'])),
                      'invalid upstream version')
              for key in ('branch', 'publish_branch'):
                  require(isinstance(m[key], str) and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_./-]{1,150}', m[key])
                          and '..' not in m[key] and '//' not in m[key] and not m[key].endswith(('/', '.', '.lock'))
                          and all(not x.startswith('.') for x in m[key].split('/')), 'invalid branch: ' + key)
              require(m['publish_branch'].startswith('release-formal/') and m['branch'] != m['publish_branch']
                      and m['branch'] != 'main', 'isolated publication/source branch required')
              require(isinstance(m['workflow_path'], str) and re.fullmatch(
                  r'\.github/workflows/publish-formal-[A-Za-z0-9_-]+\.yml', m['workflow_path']), 'invalid workflow path')
              require(positive(m['pr']) and m['make_latest'] in ('true', 'false'), 'invalid PR/latest policy')
              require(isinstance(m['notes'], str) and 0 < len(m['notes']) <= 20000
                      and ('未进行游戏/GPU实测' in m['notes'] or 'Game/GPU runtime validation not performed' in m['notes']),
                      'notes must explicitly disclose missing game/GPU tests')
              require(('$' + '{{') not in m['notes'], 'GitHub expression syntax forbidden in embedded notes')
              require(isinstance(m['runs'], list) and 1 <= len(m['runs']) <= 4, 'invalid run count')
              run_ids = set()
              for r in m['runs']:
                  require(isinstance(r, dict) and set(r) == {'id', 'head_sha', 'head_branch', 'workflow_id', 'path', 'run_attempt', 'event', 'jobs'}, 'invalid run schema')
                  require(positive(r['id']) and r['id'] not in run_ids and positive(r['workflow_id'])
                          and positive(r['run_attempt']), 'invalid run identity')
                  run_ids.add(r['id'])
                  require(r['head_sha'] == m['head'] and r['head_branch'] == m['branch']
                          and r['path'] == '.github/workflows/build.yml' and r['event'] == 'pull_request', 'run/source binding mismatch')
                  require(isinstance(r['jobs'], list) and len(r['jobs']) == 4, 'expected all four fixed build jobs')
                  wanted = {'build': 'success', 'portable-contracts': 'success',
                            'publish-test-release': 'skipped', 'publish-synced-test-release': 'skipped'}
                  got = {}; ids = set()
                  for j in r['jobs']:
                      require(isinstance(j, dict) and set(j) == {'id', 'name', 'conclusion'}
                              and positive(j['id']) and j['id'] not in ids and j['name'] not in got, 'invalid job identity')
                      got[j['name']] = j['conclusion']; ids.add(j['id'])
                  require(got == wanted, 'build and portable jobs must succeed; publishers must be skipped')
              a = m['artifact']
              require(isinstance(a, dict) and set(a) == {'id', 'name', 'size_in_bytes', 'digest'}
                      and positive(a['id']) and positive(a['size_in_bytes']) and a['size_in_bytes'] <= 512*1024**2
                      and isinstance(a['digest'], str) and re.fullmatch('sha256:[0-9a-f]{64}', a['digest']), 'invalid artifact schema')
              require(a['name'] == 'OptiScaler-F5-CN-' + m['checkout'] + '-' + str(m['runs'][0]['run_attempt']),
                      'artifact name/checkout/attempt mismatch')
              name = package_name(m); expected = {name, name + '.sha256', 'build-metadata.json'}
              require(isinstance(m['assets'], list) and len(m['assets']) == 3, 'expected original three assets')
              seen = set()
              for a in m['assets']:
                  require(isinstance(a, dict) and set(a) == {'member', 'name', 'sha256', 'size'}
                          and a['member'] == a['name'] and a['name'] in expected and a['name'] not in seen,
                          'asset renaming/replacement is forbidden')
                  require(positive(a['size']) and a['size'] <= 512*1024**2 and isinstance(a['sha256'], str)
                          and re.fullmatch('[0-9a-f]{64}', a['sha256']), 'invalid asset size/hash')
                  seen.add(a['name'])
              require(seen == expected, 'original asset identity mismatch')


          def safe_entries(z):
              entries = z.infolist(); require(0 < len(entries) <= 10000, 'invalid ZIP entry count')
              seen = set(); total = 0; result = {}
              for i in entries:
                  name = i.orig_filename
                  require(name == i.filename and name and not re.search(r'(^/|[\\:\x00-\x1f])', name), 'unsafe ZIP path')
                  parts = name.rstrip('/').split('/')
                  require(all(x not in ('', '.', '..') and not re.search(r'[. ]$|[<>"|?*]', x)
                              and not re.match(r'(?i)^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\.|$)', x)
                              for x in parts), 'unsafe ZIP path component')
                  key = name.rstrip('/').casefold()
                  require(key not in seen, 'duplicate/case-colliding ZIP member'); seen.add(key)
                  kind = stat.S_IFMT(i.external_attr >> 16)
                  require(kind in (0, stat.S_IFREG, stat.S_IFDIR) and not i.flag_bits & 1, 'special/encrypted ZIP member')
                  require(not (kind == stat.S_IFDIR and not i.is_dir()) and not (kind == stat.S_IFREG and i.is_dir()), 'ZIP kind/name conflict')
                  total += i.file_size
                  require(i.file_size <= 512*1024**2 and total <= 2*1024**3, 'ZIP expansion budget exceeded')
                  if not i.is_dir(): result[name] = i
              files = {n.casefold() for n in result}
              for name in seen:
                  parts = name.split('/')
                  require(not any('/'.join(parts[:i]) in files for i in range(1, len(parts))), 'ZIP file/parent collision')
              return result


          def verify_defaults(data):
              expected = {b'FGOutput': (b'FrameGen', b'f5low'), b'FrameGenerator': (b'F5Low', b'xefg_tensor')}
              found = set(); sections = set(); section = b''
              for index, line in enumerate(data.splitlines()):
                  if index == 0: line = line.removeprefix(b'\xef\xbb\xbf')
                  match = re.fullmatch(rb'\[([^]\r\n]+)\][ \t]*(?:[;#].*)?', line.strip())
                  if match:
                      section = match[1]
                      if section.lower() in (b'framegen', b'f5low'):
                          require(section.lower() not in sections, 'duplicate defaults section'); sections.add(section.lower())
                      continue
                  key = re.match(rb'^[ \t]*(FGOutput|FrameGenerator)[ \t]*=', line, re.I)
                  if key:
                      canonical = next(k for k in expected if k.lower() == key[1].lower())
                      target, value = expected[canonical]
                      require(canonical not in found and section == target and line == canonical+b'='+value,
                              'F5Low defaults mismatch')
                      found.add(canonical)
              require(found == set(expected), 'F5Low defaults missing')


          def verify_package(files, m):
              name = package_name(m); package = files[name]
              require(len(files['build-metadata.json']) <= 4*1024**2 and len(files[name+'.sha256']) <= 1024, 'metadata size budget')
              meta = object_json(files['build-metadata.json'], 'build metadata')
              require(meta.get('package') == name and meta.get('sha256') == sha(package), 'package metadata identity mismatch')
              require(files[name+'.sha256'] in ((sha(package)+' *'+name+'\n').encode(), (sha(package)+' *'+name+'\r\n').encode()), 'checksum sidecar mismatch')
              identity = {'schema': 1, 'cn_commit': m['checkout'], 'upstream_commit': m['upstream'],
                          'upstream_version': m['upstream_version'], 'upstream_repository': UPSTREAM_REPOSITORY,
                          'package_version': m['upstream_version']+'-cn-'+m['checkout'][:12],
                          'variant': 'downloader-only', 'configuration': 'Release', 'platform': 'x64', 'toolset': 'v143',
                          'hybrid_archive_sha256': HYBRID_HASH, 'game_runtime_validation': 'not performed by this workflow'}
              for k,v in identity.items(): require(meta.get(k) == v and type(meta.get(k)) is type(v), 'build identity mismatch: '+k)
              require(meta.get('f5low_kit_included') is True and meta.get('f5low_kit') == expected_kit(), 'F5Low kit metadata mismatch')
              require(isinstance(meta.get('recursive_submodules'), list) and meta['recursive_submodules']
                      and all(isinstance(x,str) and re.fullmatch(r' [0-9a-f]{40} [^\r\n]+', x) for x in meta['recursive_submodules']), 'submodule evidence missing')
              require(all(isinstance(meta.get(k),str) and meta[k] for k in ('msbuild_version','built_at_utc','packaged_at_utc')), 'toolchain/time evidence missing')
              with zipfile.ZipFile(io.BytesIO(package)) as z:
                  entries = safe_entries(z)
                  require(set(REQUIRED) | set(STAGED_PATHS.values()) <= set(entries), 'required package file missing')
                  hashes = {}
                  for n,i in entries.items():
                      base = n.rsplit('/',1)[-1].casefold()
                      require(not re.search(r'^(nvngx_dlss.*|sl\..*)\.dll$|\.(pdb|exp|lib|ilk|asi)$|latewarp|nrtrace', base)
                              and base != 'dlssg_sm86.dll', 'forbidden downloader-only binary')
                      if base in ('f5low.dll', 'libxess_fg.dll'):
                          require(n in (STAGED_PATHS['f5low.dll'], STAGED_PATHS['libxess_fg.dll']), 'unexpected F5Low DLL path')
                      if n.casefold().startswith('optiscaler/plugins/'):
                          require(n == STAGED_PATHS['f5low.dll'], 'unexpected F5Low plugin path')
                      with z.open(i) as stream: hashes[n] = hashlib.file_digest(stream, 'sha256').hexdigest()
                  for key,dest in STAGED_PATHS.items():
                      require(entries[dest].file_size == FILE_SIZES[key] and hashes[dest] == FILE_SHA256[key], 'pinned F5Low component mismatch: '+key)
                  for n in ('BUILD-INFO.CN.json','SHA256SUMS.txt','OptiScaler.ini'):
                      require(entries[n].file_size <= 4*1024**2, 'oversized package metadata')
                  inner = object_json(z.read('BUILD-INFO.CN.json'), 'inner build metadata')
                  require(inner == {k:v for k,v in meta.items() if k not in ('package','sha256','verified_archive_files')}, 'inner/outer metadata mismatch')
                  verify_defaults(z.read('OptiScaler.ini'))
                  checksums = {}
                  for line in z.read('SHA256SUMS.txt').decode('utf-8-sig').splitlines():
                      match = re.fullmatch(r'([0-9a-f]{64}) \*(.+)', line)
                      require(match and match[2] not in checksums, 'invalid internal checksum manifest')
                      checksums[match[2]] = match[1]
                  require(checksums == {k:v for k,v in hashes.items() if k != 'SHA256SUMS.txt'}, 'internal checksums mismatch')
                  require(type(meta.get('verified_archive_files')) is int and meta['verified_archive_files'] == len(entries), 'archive file count mismatch')
                  binaries = meta.get('binaries')
                  require(isinstance(binaries,list) and len(binaries) == 2, 'compiled binary evidence missing')
                  records = {b.get('name'):b.get('sha256') for b in binaries if isinstance(b,dict)}
                  require(set(records) == {'OptiScaler.dll','nvngx.dll_dlssnr.dll'}, 'compiled binary names mismatch')
                  for n,h in records.items():
                      require(hashes[n] == h, 'compiled binary hash mismatch')
                      with z.open(n) as stream:
                          data = stream.read(1024*1024+96)
                      require(len(data) >= 256 and data[:2] == b'MZ', 'invalid PE DLL')
                      off = struct.unpack_from('<I',data,0x3c)[0]
                      require(off <= len(data)-96 and data[off:off+4] == b'PE\0\0'
                              and struct.unpack_from('<H',data,off+4)[0] == 0x8664
                              and struct.unpack_from('<H',data,off+24)[0] == 0x20b
                              and struct.unpack_from('<H',data,off+22)[0] & 0x2000, 'invalid x64 DLL header')
                  hybrid = meta.get('hybrid_assets')
                  require(isinstance(hybrid,list) and len(hybrid) == 15, 'expected fifteen hybrid assets')
                  paths = set()
                  for item in hybrid:
                      require(isinstance(item,dict) and isinstance(item.get('path'),str), 'invalid hybrid record')
                      n = 'OptiScaler/nvfp4/hybrid/' + item['path']
                      require(n not in paths and n in hashes and hashes[n] == item.get('sha256'), 'hybrid content mismatch')
                      paths.add(n)


          def extract_assets(blob, m):
              require(isinstance(blob,bytes) and len(blob) == m['artifact']['size_in_bytes'], 'archive size mismatch')
              require('sha256:'+sha(blob) == m['artifact']['digest'], 'archive hash mismatch')
              try:
                  with zipfile.ZipFile(io.BytesIO(blob)) as z:
                      entries = safe_entries(z)
                      require(set(entries) == {a['member'] for a in m['assets']} and len(z.infolist()) == 3, 'artifact members mismatch')
                      files = {}
                      for a in m['assets']:
                          require(entries[a['member']].file_size == a['size'], 'asset size mismatch')
                          data = z.read(a['member'])
                          require(sha(data) == a['sha256'], 'asset hash mismatch')
                          files[a['name']] = data
                  verify_package(files, m)
                  return files
              except (zipfile.BadZipFile, UnicodeError, RuntimeError) as ex:
                  if isinstance(ex, Stop): raise
                  raise Stop('invalid package archive') from ex


          def guard(m, env, event):
              validate_manifest(m)
              expected = {'GITHUB_ACTIONS':'true','GITHUB_EVENT_NAME':'push','GITHUB_REPOSITORY':m['repository'],
                          'GITHUB_REF':'refs/heads/'+m['publish_branch'],'GITHUB_RUN_ATTEMPT':'1',
                          'GITHUB_WORKFLOW_REF':m['repository']+'/'+m['workflow_path']+'@refs/heads/'+m['publish_branch']}
              for k,v in expected.items(): require(env.get(k) == v, 'context mismatch: '+k)
              require(re.fullmatch('[0-9a-f]{40}',env.get('GITHUB_SHA','')) and re.fullmatch('[1-9][0-9]*',env.get('GITHUB_RUN_ID','')), 'invalid workflow SHA/run')
              require(env.get('GITHUB_SERVER_URL','https://github.com') == 'https://github.com'
                      and env.get('GITHUB_API_URL','https://api.github.com') == 'https://api.github.com', 'unexpected GitHub server')
              require(event.get('after') == env['GITHUB_SHA'] and event.get('before') == m['head']
                      and event.get('ref') == expected['GITHUB_REF'], 'publisher must be single push after reviewed source')
              require(event.get('forced') is False and event.get('deleted') is False, 'forced/deleted event')
              require(event.get('repository',{}).get('full_name') == m['repository'], 'event repository mismatch')


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None


          class API:
              def __init__(self, token, write=False):
                  require(isinstance(token,str) and token, 'empty ephemeral workflow token')
                  self.token=token; self.write=write; self.opener=urllib.request.build_opener(NoRedirect)

              def request(self, method, path, body=None, binary=False):
                  require(method in ('GET','POST','PATCH') and (method == 'GET' or self.write), 'forbidden/read-only API method')
                  url = path if path.startswith('https://') else 'https://api.github.com'+path
                  u = urllib.parse.urlsplit(url)
                  require(u.scheme == 'https' and u.hostname in ('api.github.com','uploads.github.com')
                          and not u.username and not u.password and u.port in (None,443) and not u.fragment, 'untrusted API endpoint')
                  data = body if isinstance(body,bytes) else json.dumps(body).encode() if body is not None else None
                  accept = 'application/octet-stream' if binary and re.fullmatch(r'/repos/[^/]+/[^/]+/releases/assets/[0-9]+',u.path) else 'application/vnd.github+json'
                  endpoint = method+' '+u.path
                  print('GitHub request:',endpoint,flush=True)
                  headers = {'Authorization':'Bearer '+self.token,'Accept':accept,'X-GitHub-Api-Version':'2022-11-28',
                             'Content-Type':'application/octet-stream' if isinstance(body,bytes) else 'application/json'}
                  try:
                      response = self.opener.open(urllib.request.Request(url,data=data,method=method,headers=headers),timeout=180)
                  except urllib.error.HTTPError as ex:
                      if ex.code == 404 and method == 'GET' and not binary: return None
                      if ex.code in (301,302,303,307,308) and method == 'GET' and binary:
                          target=ex.headers.get('Location',''); host=urllib.parse.urlsplit(target)
                          require(host.scheme == 'https' and not host.username and not host.password and host.port in (None,443)
                                  and host.hostname and (host.hostname.endswith('.blob.core.windows.net')
                                  or host.hostname == 'release-assets.githubusercontent.com'
                                  or host.hostname.endswith('.githubusercontent.com')), 'untrusted download redirect')
                          # Fresh request has NO Authorization. Chained redirects remain disabled.
                          try: response=self.opener.open(urllib.request.Request(target,headers={'Accept':'application/octet-stream'}),timeout=180)
                          except Exception: raise Stop('redirected download failed (URL redacted)') from None
                      else: raise Stop('GitHub HTTP '+str(ex.code)+' at '+endpoint+' (body/query redacted; never retry writes)') from None
                  except Exception:
                      raise Stop('GitHub request failed at '+endpoint+' (details redacted; never retry writes)') from None
                  with response:
                      data=response.read(512*1024**2+1)
                      require(len(data) <= 512*1024**2, 'response exceeds limit')
                  if binary: return data
                  try: return json.loads(data)
                  except (ValueError,UnicodeError): raise Stop('invalid GitHub JSON response at '+endpoint) from None


          def verify_publisher(api,m,publisher):
              root='/repos/'+m['repository']
              ref=api.request('GET',root+'/git/ref/heads/'+m['publish_branch'])
              require(ref and ref.get('object',{}).get('sha') == publisher, 'publisher branch changed')
              commit=api.request('GET',root+'/commits/'+publisher)
              require(commit and [p.get('sha') for p in commit.get('parents',[])] == [m['head']], 'publisher parent mismatch')
              changed=commit.get('files',[])
              require(len(changed) == 1 and changed[0].get('filename') == m['workflow_path']
                      and changed[0].get('status') == 'added', 'publisher must only add fixed workflow')


          def verify_source(api,m):
              root='/repos/'+m['repository']
              ref=api.request('GET',root+'/git/ref/heads/'+m['branch'])
              require(ref and ref.get('object',{}).get('sha') == m['head'], 'source branch changed')
              for commit in (m['head'],m['checkout']):
                  c=api.request('GET',root+'/git/commits/'+commit)
                  require(c and c.get('tree',{}).get('sha') == m['tree'], 'source/checkout tree mismatch')
              pr=api.request('GET',root+'/pulls/'+str(m['pr']))
              require(pr and pr.get('state') == 'open' and pr.get('head',{}).get('sha') == m['head']
                      and pr.get('head',{}).get('ref') == m['branch']
                      and pr.get('base',{}).get('sha') == m['base'] and pr.get('base',{}).get('ref') == 'main'
                      and pr.get('head',{}).get('repo',{}).get('full_name') == m['repository']
                      and pr.get('base',{}).get('repo',{}).get('full_name') == m['repository'], 'PR binding changed')


          def verify_runs(api,m):
              root='/repos/'+m['repository']
              for expected in m['runs']:
                  path=root+'/actions/runs/'+str(expected['id'])
                  run=api.request('GET',path)
                  for key in ('id','head_sha','head_branch','workflow_id','path','run_attempt','event'):
                      require(run and run.get(key) == expected[key], 'run mismatch: '+key)
                  require(run.get('repository',{}).get('full_name') == m['repository'] and run.get('status') == 'completed'
                          and run.get('conclusion') == 'success', 'run not green')
                  attempt=api.request('GET',path+'/attempts/'+str(expected['run_attempt']))
                  require(attempt and attempt.get('status') == 'completed' and attempt.get('conclusion') == 'success'
                          and attempt.get('head_sha') == m['head'] and attempt.get('run_attempt') == expected['run_attempt'], 'attempt mismatch')
                  jobs=api.request('GET',path+'/attempts/'+str(expected['run_attempt'])+'/jobs?per_page=100')
                  require(jobs and jobs.get('total_count') == len(expected['jobs'])
                          and len(jobs.get('jobs',[])) == len(expected['jobs']), 'job count mismatch')
                  actual={j['id']:j for j in jobs['jobs']}
                  require(len(actual) == len(expected['jobs']), 'duplicate job IDs')
                  for j in expected['jobs']:
                      got=actual.get(j['id'])
                      require(got and got.get('name') == j['name'] and got.get('status') == 'completed'
                              and got.get('conclusion') == j['conclusion'], 'job mismatch')


          def verify_remote(api,m):
              root='/repos/'+m['repository']
              verify_source(api,m)
              verify_runs(api,m)
              a=api.request('GET',root+'/actions/artifacts/'+str(m['artifact']['id']))
              for k in ('id','name','size_in_bytes','digest'):
                  require(a and a.get(k) == m['artifact'][k], 'artifact mismatch: '+k)
              require(a.get('expired') is False and a.get('workflow_run',{}).get('id') == m['runs'][0]['id']
                      and a.get('workflow_run',{}).get('head_sha') == m['head'], 'artifact run mismatch')
              return extract_assets(api.request('GET',root+'/actions/artifacts/'+str(a['id'])+'/zip',binary=True),m)


          def verify_uploaded(api,root,rid,files):
              assets=api.request('GET',root+'/releases/'+str(rid)+'/assets?per_page=100')
              require(isinstance(assets,list) and len(assets) == len(files), 'asset count mismatch')
              seen=set()
              for a in assets:
                  require(a.get('name') in files and a['name'] not in seen and a.get('state') == 'uploaded', 'unexpected/duplicate asset')
                  seen.add(a['name']); data=files[a['name']]
                  require(a.get('size') == len(data), 'uploaded size mismatch')
                  if a.get('digest'): require(a['digest'] == 'sha256:'+sha(data), 'uploaded digest mismatch')
                  # Always read back the bytes, even when GitHub reports its own digest.
                  require(sha(api.request('GET',root+'/releases/assets/'+str(a['id']),binary=True)) == sha(data), 'downloaded asset mismatch')


          def check_release(value,m,rid,draft):
              require(value and value.get('id') == rid and value.get('tag_name') == m['tag']
                      and value.get('draft') is draft and value.get('prerelease') is False
                      and value.get('target_commitish') == m['head']
                      and value.get('name') == m['title'] and value.get('body') == m['notes'], 'release identity/state mismatch')


          def publish(api,m,files,publisher):
              root='/repos/'+m['repository']; tag=urllib.parse.quote(m['tag'],safe='')
              require(api.request('GET',root+'/git/ref/tags/'+tag) is None, 'tag already exists')
              require(api.request('GET',root+'/releases/tags/'+tag) is None, 'release already exists')
              page=1
              while True:
                  existing=api.request('GET',root+'/releases?per_page=100&page='+str(page))
                  require(isinstance(existing,list), 'cannot inspect existing drafts')
                  require(all(x.get('tag_name') != m['tag'] for x in existing), 'draft/tag collision')
                  if len(existing)<100: break
                  page+=1; require(page<=100, 'too many releases to inspect safely')
              rid=None; stage='tag creation'; publication_requested=False
              try:
                  ref=api.request('POST',root+'/git/refs',{'ref':'refs/tags/'+m['tag'],'sha':m['head']})
                  require(ref and ref.get('object',{}).get('type') == 'commit' and ref['object']['sha'] == m['head'], 'new tag target mismatch')
                  stage='draft creation'
                  created=api.request('POST',root+'/releases',{'tag_name':m['tag'],'target_commitish':m['head'],
                      'name':m['title'],'body':m['notes'],'draft':True,'prerelease':False,'make_latest':'false'})
                  require(created and positive(created.get('id')), 'invalid new draft ID')
                  rid=created['id']; check_release(created,m,rid,True)
                  for name,data in files.items():
                      stage='asset upload '+name
                      uploaded=api.request('POST','https://uploads.github.com'+root+'/releases/'+str(rid)
                          +'/assets?name='+urllib.parse.quote(name,safe=''),data)
                      require(uploaded and uploaded.get('name') == name and uploaded.get('size') == len(data)
                              and uploaded.get('state') == 'uploaded', 'upload response identity mismatch')
                  stage='draft readback'; verify_uploaded(api,root,rid,files)
                  ref=api.request('GET',root+'/git/ref/tags/'+tag)
                  require(ref and ref.get('object',{}).get('type') == 'commit' and ref['object']['sha'] == m['head'], 'prepublication tag target mismatch')
                  check_release(api.request('GET',root+'/releases/'+str(rid)),m,rid,True)
                  # Recheck mutable source and publisher bindings immediately before public visibility.
                  verify_publisher(api,m,publisher)
                  verify_source(api,m)
                  verify_runs(api,m)
                  stage='public transition'; publication_requested=True
                  api.request('PATCH',root+'/releases/'+str(rid),{'draft':False,'prerelease':False,'make_latest':m['make_latest']})
                  stage='public readback'; check_release(api.request('GET',root+'/releases/'+str(rid)),m,rid,False)
                  ref=api.request('GET',root+'/git/ref/tags/'+tag)
                  require(ref and ref.get('object',{}).get('type') == 'commit' and ref['object']['sha'] == m['head'], 'tag target mismatch')
                  verify_uploaded(api,root,rid,files)
                  return rid
              except Exception as ex:
                  state='publication uncertain; release may be public' if publication_requested else 'publication stopped; a tag/draft/upload may already exist'
                  detail='; '+str(ex) if isinstance(ex,Stop) else '; error details redacted'
                  raise Stop(state+'; stage='+stage+'; release ID='+str(rid)
                             +'; preserve all tag/draft/assets; reconcile exact state before any retry; no cleanup'+detail) from None


          def add_provenance(files,m,env):
              result=dict(files)
              provenance={**m,'source_commit':m['head'],'build_checkout_commit':m['checkout'],
                          'publisher_commit':env['GITHUB_SHA'],'publisher_run':env['GITHUB_RUN_ID'],
                          'release_prerelease':False,'original_assets_unchanged':True,
                          'game_gpu_runtime_validation':'not performed',
                          'f5low_official_identity':expected_kit()}
              result['provenance.json']=(json.dumps(provenance,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode()
              result['SHA256SUMS']=''.join(sha(v)+'  '+k+'\n' for k,v in sorted(result.items())).encode()
              return result


          def ci_main(m,mode):
              require(mode in ('verify','publish'), 'invalid mode')
              with open(os.environ['GITHUB_EVENT_PATH'],'rb') as file: event=object_json(file.read(),'push event')
              guard(m,os.environ,event)
              api=API(os.environ['GITHUB_TOKEN'],write=mode=='publish')
              verify_publisher(api,m,os.environ['GITHUB_SHA'])
              files=add_provenance(verify_remote(api,m),m,os.environ)
              if mode == 'publish': print('Verified new formal release ID',publish(api,m,files,os.environ['GITHUB_SHA']))
              else: print('Read-only verification passed for',m['repository'])

