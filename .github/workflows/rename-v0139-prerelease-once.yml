              refs(api,sha)
              require(api.request('GET',ROOT+'/releases/latest')['id']==OLD_ID,'Latest must remain older release')
              old=snapshot(api.request('GET',ROOT+'/releases/'+str(OLD_ID)))
              require(old['id']==OLD_ID and old['tag_name']==OLD_TAG and old['draft'] is False
                      and old['prerelease'] is False,'previous stable identity changed')
              cur=snapshot(api.request('GET',TARGET))
              require(cur['id']==RID and cur['tag_name']==TAG and cur['target_commitish']==HEAD
                      and cur['draft'] is False and cur['prerelease'] is True and not cur['immutable'],'target prerelease identity changed')
              check_assets(cur['assets'])
              return old,cur
          def run(old_notes,mode):
              require(mode in ('verify','rename'),'invalid mode')
              with open(os.environ['GITHUB_EVENT_PATH'],'rb') as f: event=parse(f.read())
              sha=guard(os.environ,event);token=os.environ['GITHUB_TOKEN']
              old,cur=state(API(token),sha)
              require(cur['name']==OLD_TITLE and cur['body']==old_notes,'target original title/body changed')
              if mode=='verify':
                  print('Read-only verification passed: exact target prerelease, older Latest, assets and refs');return
              expected={**cur,**patch()}
              writer=API(token,patch())
              try:
                  result=writer.request('PATCH',TARGET,patch())
                  latest,after=state(writer,sha)
                  require(latest==old and after==expected and snapshot(result)==expected,
                          'readback changed fields outside requested title/body or original assets')
                  print('Verified only name/body updated:',RID,TAG,'prerelease and older Latest unchanged')
              except Exception as e:
                  raise Stop('PATCH may have been applied; reconcile exact release before any retry; '+str(e)) from None

          try:
              run('## OptiScaler F5 CN 0.1.39 · 中文预发布\n\n基于上游 [v0.1.39](https://github.com/janblade/OptiScaler-F5-DLSSNR-Multipass/releases/tag/v0.1.39)。上游正文标注为预发布，本版不替换旧正式版。\n\n- 补译状态页、NR 模型权重和 Vulkan 相关界面，修正旧版 LUT 动态说明、自定义 DLSS-G 提示等漏译。自定义文件、目录和模型名保持原样。扫描覆盖 3,281 条：3,006 条汉化、275 条有意保留；缺译／过期均为 0。扫描并不等于逐屏验收。\n- 安装包包含新的 NR 转发器 `nvngx.dll_dlssnr.dll`、F5Low 1.1.0.208、Intel XeSS-FG 1.3.4.95 及对应许可。NR 模型 `nvngx_dlssnr.dll` 不随包。\n- NVIDIA Streamline / DLSS-G 的 6 个 DLL 不随包。需要时使用包内 `get_streamline.ps1` 从 NVIDIA 官方仓库获取固定的 Streamline 2.14.16；脚本验证哈希和签名，不会开启帧生成或覆盖不同版本的现有文件。手动下载时以[官方资产](https://github.com/NVIDIA-RTX/Streamline/releases/tag/v2.14.16)及包内 `redist/streamline/manifest.json` 为准：x64 SDK ZIP SHA-256 为 `32041e51db0cab709a271b72a352281b690c2abbd669a827809401a5dd23956b`，不要用随包上游英文说明中的旧校验值。\n- 40 系的内置 MFG 解锁独立于下载器和 F5Low。当前入口见[上游插件说明](https://github.com/janblade/OptiScaler-F5-DLSSNR-Multipass/blob/v0.1.39/docs/PLUGINS.md)，不要把旧 `AdaMfgUnlock` 设置与新版 `[MFGUnlock]` 混用。不与外置解锁器同时使用。\n\nWindows MSVC Release x64 构建、可移植检查和归档校验通过后才发布。未进行游戏/GPU实测；请备份现有安装，只在支持修改的单人游戏中测试。\n\n[源码草稿 PR](https://github.com/Night-SHANG/OptiScaler-F5-DLSSNR-Multipass-CN/pull/1) · [本版 CI](https://github.com/Night-SHANG/OptiScaler-F5-DLSSNR-Multipass-CN/actions/runs/44984570604)\n', 'verify')
          except Stop as e:
              print(str(e),file=sys.stderr)
              sys.exit(1)
          PY
